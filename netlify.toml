# ================================================================
# netlify.toml — AI4 Website Design Studio
# ai4websitedesign.com | Apropos Group LLC
# ================================================================

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_OMIT_KEYS = "RESEND_TO_EMAIL,RESEND_FROM_EMAIL,OWNER_NOTIFICATION_EMAIL,CLIENT_NOTIFICATION_EMAIL"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Language = "en"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/studio"
  to = "/ai4-design-studio.html"
  status = 200

[[redirects]]
  from = "/preview"
  to = "/ai4-design-studio-preview.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/es"
  to = "https://espanol.ai4websitedesign.com"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
